.grain{position:fixed;inset:0;z-index:3;opacity:.028;pointer-events:none;background-image:url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)'/%3E%3C/svg%3E");background-size:200px 200px}
.credito{position:fixed;bottom:12px;left:50%;transform:translateX(-50%);z-index:5;
  font-family:'Karla',sans-serif;font-size:.62rem;letter-spacing:.14em;text-transform:uppercase;
  color:rgba(220,215,200,.32);text-decoration:none;opacity:0;animation:suaveNav 1s 4.2s forwards}
.credito:hover{color:rgba(0,201,167,.8)}
.hint{position:fixed;bottom:36px;left:50%;transform:translateX(-50%);z-index:2;font-family:'Karla',sans-serif;font-size:.68rem;letter-spacing:.22em;color:rgba(220,215,200,.3);text-transform:uppercase;opacity:0;animation:suaveNav 1.2s 3.6s forwards}
/* v1.1: centrado, no pegado a la derecha.
   Con right:32px los links se cortaban contra el borde en ventanas
   angostas, y como html/body tienen overflow:hidden no habia scroll
   para alcanzarlos: quedaban inaccesibles. Centrado no puede pasar. */
.nav-top{position:fixed;top:28px;left:50%;transform:translateX(-50%);z-index:4;
  display:flex;gap:26px;flex-wrap:wrap;justify-content:center;
  max-width:calc(100% - 48px);opacity:0;animation:suaveNav 1s 3.8s forwards}
.nav-top a{font-family:'Karla',sans-serif;font-size:.72rem;letter-spacing:.2em;text-transform:uppercase;color:rgba(220,215,200,.5);text-decoration:none;transition:color .2s}
.nav-top a:hover{color:#f5f0e8}
@keyframes suave{to{opacity:1;transform:translateY(0) translateX(0)}}
/* El keyframe de arriba pisa el translateX(-50%) del nav, asi que el nav
   lleva su propia animacion que solo toca la opacidad. */
@keyframes suaveNav{to{opacity:1}}
/* v1.2: .hint y .nav-top se centran con transform:translateX(-50%).
   El keyframe compartido termina en translateX(0) y con forwards ese
   estado queda fijo, borrando el centrado: el elemento se queda con su
   borde izquierdo en el 50%. Los dos usan suaveNav, que solo anima la
   opacidad. Va en la regla base, no como override, para no depender
   del orden de las declaraciones. */

@media(max-height:640px){

.fade-out{animation:fadeOut .9s ease forwards !important}
